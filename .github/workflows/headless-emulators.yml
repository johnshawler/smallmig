name: Headless emulators
on:
  push:
    branches: [little-league-playable, recovery/nov10-rebuild-baseline]
    paths:
      - '.github/workflows/headless-emulators.yml'
      - 'environment/headless-*'
      - 'tools/setup_mesen.py'
      - 'src/boot.s'
      - 'ports/little-league/vendor/platform-a1200/display_ar2.*'
      - 'ports/little-league/vendor/platform-a1200/arhw_test.c'
      - 'ports/little-league/vendor/platform-a1200/ar_sprite_test.c'
      - 'ports/little-league/vendor/runtime/arender.*'
      - 'ports/little-league/vendor/tests/**'
      - 'ports/little-league/tests/**'
      - 'ports/little-league/vendor/runtime/rt_x.s'
      - 'ports/little-league/vendor/translator/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Mesen and FS-UAE
        run: sh environment/headless-install.sh
      - name: Execute both emulators headlessly
        run: python3 environment/headless-smoke.py
      - name: Compare native AGA fetch modes pixel for pixel
        run: python3 environment/headless-aga.py
      - name: Show installation and execution evidence
        if: always()
        run: |
          test ! -f build/headless/mesen.log || tail -60 build/headless/mesen.log
          test ! -f build/headless/fs-uae-console.log || tail -60 build/headless/fs-uae-console.log
          test ! -f build/headless/result.json || cat build/headless/result.json
          find build/headless/fs-uae -type f \( -name fs-uae.log.txt -o -name debug.uae \) -exec tail -100 {} \;
  native-translator:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native execution test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 gcc libc6-dev git ca-certificates gcc-m68k-linux-gnu binutils-m68k-linux-gnu libc6-dev-m68k-cross qemu-user
      - name: Compare native registers, flags, memory and exact I/O cycles
        working-directory: ports/little-league/vendor
        run: XL_DIRECT_FIXED_IO=1 make -C tests/xlunit TRIALS=32 QEMUFLAGS='-cpu m68020 -one-insn-per-tb'
      - name: Check runtime short-branch encodings
        run: python3 ports/little-league/tests/check_rt_x_branches.py
      - name: Check native renderer storage metadata
        run: python3 ports/little-league/tests/test_native_storage_metadata.py
      - name: Check interrupt-boundary flags in an independent 68020 core
        run: |
          mkdir -p build/test-deps/musashi
          git -C build/test-deps/musashi init
          git -C build/test-deps/musashi fetch --depth=1 https://github.com/kstenerud/Musashi.git 313ebf1bd9f4d0d93341eb5ce21fd8a119e9dbdd
          git -C build/test-deps/musashi checkout --detach FETCH_HEAD
          test "$(git -C build/test-deps/musashi rev-parse HEAD)" = 313ebf1bd9f4d0d93341eb5ce21fd8a119e9dbdd
          MUSASHI_DIR="$PWD/build/test-deps/musashi" python3 ports/little-league/tests/test_translator_interrupt_flags.py -v
